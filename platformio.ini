[platformio]
default_envs = d1_mini_public

[env:d1_mini_public]
platform = espressif8266 @ 4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  fastled/FastLED @ 3.10.9
  tzapu/WiFiManager @ 2.0.17
; Use FastLED's ESP8266 defaults, including interrupts and their timing threshold.
build_flags =
  -D CHAOSUHR_PUBLIC_BUILD=1
  -MMD
; One firmware for every clock: credentials are created on the device.

; Security release 2.0.8 is Wemos-only. The unchanged ESP32 2.0.6 package
; retains its own source/configuration; its security port is deferred.
