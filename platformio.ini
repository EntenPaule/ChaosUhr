[platformio]
default_envs = d1_mini_public

[env:d1_mini_public]
platform = espressif8266 @ 4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  fastled/FastLED @ 3.10.9
  tzapu/WiFiManager @ 2.0.17
; Use FastLED's ESP8266 defaults, including interrupts and their timing threshold.
build_flags =
  -D CHAOSUHR_PUBLIC_BUILD=1
  -MMD
; One firmware for every clock: credentials are created on the device.

[env:esp32dev_public]
extends = env:d1_mini_public
platform = espressif32 @ 8.0.0
board = esp32dev
board_build.partitions = partitions/esp32_4mb_ota.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
build_flags =
  ${env:d1_mini_public.build_flags}
  -D CHAOSUHR_LED_PIN=32
